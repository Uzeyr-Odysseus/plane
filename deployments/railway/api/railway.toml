# Railway service config for the Django API (Gunicorn + Uvicorn)
# In Railway UI: Add Service → GitHub Repo → set Root Directory to repo root
# Set the Dockerfile path and build context below.

[build]
builder = "DOCKERFILE"
dockerfilePath = "apps/api/Dockerfile.api"
buildContext = "."

[deploy]
startCommand = "./bin/docker-entrypoint-api.sh"
healthcheckPath = "/health/"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
