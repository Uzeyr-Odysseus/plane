# Railway service config for the Live server (WebSocket / real-time collaboration via Hocuspocus)
# Built from the repo root so Turbo can prune the monorepo correctly.

[build]
builder = "DOCKERFILE"
dockerfilePath = "apps/live/Dockerfile.live"
buildContext = "."

[deploy]
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
